name: CI
on: push

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node
          cache: true

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node
          cache: true
          working-directory: ./e2e-tests

      - name: Generate theme symlinks
        run: |
          mkdir -p public/static
          node -e "
            const path = require('path');
            const {createRequire} = require('module');
            const req = createRequire(path.join(process.cwd(), 'package.json'));
            const {generateThemeSymlinks} = req('@kausal/themes/setup.cjs');
            generateThemeSymlinks(path.join(process.cwd(), 'public', 'static', 'themes'), {verbose: false});
          "
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck

  storybook-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node
          cache: true

      # The story decorators load themes from public/static, same as the unit tests.
      - name: Generate theme symlinks
        run: |
          mkdir -p public/static
          node -e "
            const path = require('path');
            const {createRequire} = require('module');
            const req = createRequire(path.join(process.cwd(), 'package.json'));
            const {generateThemeSymlinks} = req('@kausal/themes/setup.cjs');
            generateThemeSymlinks(path.join(process.cwd(), 'public', 'static', 'themes'), {verbose: false});
          "

      # Stories run in real Chromium via @vitest/browser-playwright.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:storybook

  build:
    uses: kausaltech/github-actions/.github/workflows/build.yaml@main
    with:
      project_id: watch-ui
      project_type: nextjs
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_USER: ${{ secrets.NPM_USER }}
      NPM_PASSWORD: ${{ secrets.NPM_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  test:
    needs: [build]
    uses: ./.github/workflows/e2e-image.yaml
    with:
      image: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.image_tag }}
      backend_base_url: https://api.watch.kausal.tech
      build_id: ${{ needs.build.outputs.build_id }}
      s3_endpoint: ${{ vars.BUILD_S3_ENDPOINT }}
      s3_bucket: ${{ vars.BUILD_S3_BUCKET }}
    secrets: inherit

  deploy:
    needs: [build]
    uses: kausaltech/github-actions/.github/workflows/deploy.yaml@main
    secrets:
      gitops_ssh_key: ${{ secrets.GITOPS_SSH_KEY }}
    if: needs.build.outputs.deployment_env
    with:
      docker_image_repo: ${{ needs.build.outputs.image }}
      docker_image_tag: ${{ needs.build.outputs.image_tag }}
      project_id: watch-ui
      build_id: ${{ needs.build.outputs.build_id }}
      deployment_env: ${{ needs.build.outputs.deployment_env }}
